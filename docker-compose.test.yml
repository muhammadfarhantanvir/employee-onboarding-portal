services:
  redis:
    image: "redis:7-alpine"
    container_name: onboarding-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      timeout: 3s
      retries: 10

  influxdb:
    image: "influxdb:1.8-alpine"
    container_name: onboarding-test-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6

  grafana:
    image: "grafana/grafana:10.4.19"
    container_name: onboarding-test-grafana
    ports:
      - "3100:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb

  zap:
    image: "zaproxy/zap-stable"
    container_name: onboarding-test-zap
    command: "tail -f /dev/null"
    network_mode: host

  minio:
    image: "minio/minio:RELEASE.2025-04-22T22-12-26Z"
    container_name: onboarding-test-minio
    command: "server /data --console-address :9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
