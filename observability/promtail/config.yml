server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nestjs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nestjs
          service: employee-onboarding-api
          __path__: /var/log/nestjs/**/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            service: service
            reqId: reqId
            traceId: traceId
            method: method
            route: route
            path: path
            statusCode: statusCode
            durationMs: durationMs
            userId: userId
            companyId: companyId
      - labels:
          level:
          service:
          method:
          route:
          statusCode:
      - timestamp:
          source: time
          format: RFC3339Nano
