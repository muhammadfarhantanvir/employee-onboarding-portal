global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - host.docker.internal:3001
          - api:3001
        labels:
          service: employee-onboarding-api

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: otel-spanmetrics
    static_configs:
      - targets:
          - otel-collector:8889
